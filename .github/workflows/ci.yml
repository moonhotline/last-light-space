name: "Continuous Integration & Vercel Build Verification"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: "Test & Vercel Build Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite (55 Unit & Integration Tests)
        run: npm run space:test

      - name: Run Vercel Build Command
        env:
          SPACE_ROOM_URL: "https://party.oodai.space"
        run: npm run space:build && node frontend/space-escape/scripts/configure-hosted-room.mjs
